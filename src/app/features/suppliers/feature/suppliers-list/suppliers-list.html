<div class="suppliers-page">
  <app-page-header
    title="Proveedores"
    subtitle="Gestiona los proveedores registrados en el taller."
    [showBackButton]="false"
  >
    <div actions class="header-actions">
      <button type="button" class="new-supplier-button" (click)="onNew()">
        <i class="pi pi-plus"></i>
        <span>Nuevo proveedor</span>
      </button>
    </div>
  </app-page-header>

  @if (store.error()) {
    <div class="load-error">{{ store.error() }}</div>
  }

  <app-filter-bar
    searchPlaceholder="Buscar por razón social, RUC, contacto o email..."
    [showStatusFilter]="true"
    [showDocumentTypeFilter]="false"
    [showDateFilters]="false"
    (filterChange)="onFilterChange($event)"
  >
  </app-filter-bar>

  <app-data-table
    [columns]="tableColumns"
    [data]="store.suppliers()"
    [totalRecords]="store.totalElements()"
    [currentPage]="currentPage"
    [pageSize]="pageSize"
    [isLoading]="isLoading"
    [showPageSize]="true"
    (pageChange)="onPageChanged($event)"
    (pageSizeChange)="onPageSizeChanged($event)"
  >
    <ng-template #rowTemplate let-supplier>
      <td>
        <div class="supplier-cell">
          <div class="supplier-name">
            <strong>{{ supplier.razonSocial }}</strong>
            @if (supplier.contacto) {
              <span>{{ supplier.contacto }}</span>
            }
          </div>
        </div>
      </td>

      <td>{{ supplier.ruc }}</td>
      <td>{{ supplier.email || '-' }}</td>
      <td>{{ supplier.telefono || '-' }}</td>

      <td class="text-center">
        <span [class]="supplier.activo ? 'chip-success' : 'chip-inactive'">
          {{ supplier.activo ? 'Activo' : 'Inactivo' }}
        </span>
      </td>

      <td class="text-center">
        <div class="supplier-actions">
          <button
            type="button"
            class="action-button"
            title="Ver proveedor"
            (click)="onView(supplier.id)"
          >
            <i class="pi pi-eye"></i>
          </button>

          <button
            type="button"
            class="action-button"
            title="Editar proveedor"
            (click)="onEdit(supplier.id)"
          >
            <i class="pi pi-pencil"></i>
          </button>

          @if (supplier.activo) {
            <button
              type="button"
              class="action-button action-danger"
              title="Desactivar proveedor"
              (click)="openDeactivateDialog(supplier)"
            >
              <i class="pi pi-ban"></i>
            </button>
          }
        </div>
      </td>
    </ng-template>
  </app-data-table>

  <app-confirmation-dialog
    [visible]="showDeactivateDialog"
    title="Desactivar proveedor"
    [message]="'¿Estás seguro de que deseas desactivar a ' + (selectedSupplier?.razonSocial ?? '') + '?'"
    type="warning"
    (confirm)="deactivateSupplier()"
    (cancel)="closeDeactivateDialog()"
  >
  </app-confirmation-dialog>
</div>
